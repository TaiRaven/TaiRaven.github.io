<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2f6df6;
      --border: #e5e5e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111114;
        --card: #1a1a1f;
        --text: #f0f0f0;
        --muted: #9a9aa0;
        --accent: #6f9bff;
        --border: #2a2a30;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8a5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 28px;
    }
    .tagline {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 16px;
    }
    .bio {
      margin: 0 0 28px;
      font-size: 16px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: border-color 0.15s, transform 0.15s;
    }
    .links a:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    footer {
      margin-top: 28px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">YN</div>
    <h1>Your Name</h1>
    <p class="tagline">ServiceNow Developer · Australia</p>
    <p class="bio">
      Short line or two about yourself. What you build, what you care about,
      what you want people landing here to know. Keep it plain and human.
    </p>
    <nav class="links">
      <a href="https://github.com/YOUR-USERNAME">GitHub</a>
      <a href="mailto:you@example.com">Email</a>
      <a href="https://www.linkedin.com/in/your-handle">LinkedIn</a>
    </nav>
    <footer>Built with a single HTML file, hosted free on GitHub Pages.</footer>
  </main>
</body>
</html>
