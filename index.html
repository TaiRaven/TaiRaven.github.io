<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>William Wood — ServiceNow Developer</title>
<meta name="description" content="William Wood — ServiceNow developer building scoped apps with the Fluent / now-sdk framework." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #0b0c0e; -webkit-font-smoothing: antialiased; font-family: 'Space Grotesk', system-ui, sans-serif; color: #e9e9e4; }
  a { color: #e9e9e4; text-decoration: none; }
  a:hover { color: #c8ff4d; }
  html { scroll-behavior: smooth; }
  ::selection { background: #c8ff4d; color: #0b0c0e; }
  a:focus-visible, button:focus-visible { outline: 2px solid #c8ff4d; outline-offset: 3px; border-radius: 2px; }

  .layout { display: grid; grid-template-columns: 240px 1fr; max-width: 1440px; margin: 0 auto; }
  .side { position: sticky; top: 0; height: 100vh; padding: 40px 28px; border-right: 1px solid #1e2024; display: flex; flex-direction: column; justify-content: space-between; }
  main { min-width: 0; }
  .sec { border-bottom: 1px solid #1e2024; }

  /* Responsive */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; height: auto; border-right: none; border-bottom: 1px solid #1e2024; }
    .sec { padding-left: 28px !important; padding-right: 28px !important; }
    .grid { grid-template-columns: 1fr !important; gap: 32px !important; }
    .intro { padding-left: 28px !important; padding-right: 28px !important; }
    h1 { font-size: clamp(34px, 9vw, 52px) !important; }
    .contact-big { font-size: clamp(32px, 10vw, 52px) !important; }
  }
  @media (max-width: 560px) {
    .sec, .intro { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="./content.js"></script>
<script>
(function () {
  var S = window.SITE || {};
  var esc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  var has = function (a) { return Array.isArray(a) && a.length > 0; };

  var MONO = "'JetBrains Mono', monospace";

  /* ---- Decide which sections are present, and number them ---- */
  var defs = [
    { id: "intro",      label: "Intro",       on: true },
    { id: "about",      label: "About",       on: has(S.about) },
    { id: "principles", label: "Principles",  on: has(S.principles) },
    { id: "stack",      label: "Stack",       on: has(S.skillGroups) },
    { id: "work",       label: "Work",        on: has(S.projects) },
    { id: "study",      label: "Case study",  on: S.caseStudy && S.caseStudy.show },
    { id: "experience", label: "Experience",  on: has(S.jobs) },
    { id: "writing",    label: "Writing",     on: has(S.posts) },
    { id: "now",        label: "Now",         on: has(S.now) },
    { id: "contact",    label: "Contact",     on: true }
  ];
  var active = defs.filter(function (d) { return d.on; }).map(function (d, i) {
    d.no = String(i).padStart(2, "0"); return d;
  });
  var noOf = {}; active.forEach(function (d) { noOf[d.id] = d.no; });

  var kicker = function (id, label) {
    return '<div data-reveal="1" data-reveal-index="0" style="font-family:' + MONO + ';font-size:11px;color:#7d8288;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:32px;">' + noOf[id] + ' — ' + esc(label) + '</div>';
  };

  /* ---- Section builders ---- */
  var B = {};

  B.intro = function () {
    var portrait = S.portrait
      ? '<img src="' + esc(S.portrait) + '" alt="' + esc(S.name) + '" style="width:100%;height:100%;object-fit:cover;display:block;" />'
      : '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:' + MONO + ';font-size:11px;color:#4d5257;line-height:1.6;">Add portrait.jpg<br>next to index.html</div>';
    return '<section id="intro" class="intro" style="padding:112px 72px 88px;border-bottom:1px solid #1e2024;display:flex;flex-wrap:wrap;gap:56px;align-items:flex-end;">'
      + '<div style="flex:1 1 480px;min-width:0;">'
      + '<div data-reveal="1" data-reveal-index="0" style="font-family:' + MONO + ';font-size:11px;color:#7d8288;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:36px;">' + noOf.intro + ' — Intro</div>'
      + '<h1 data-reveal="1" data-reveal-index="1" style="font-size:clamp(40px,5.2vw,68px);line-height:1.02;font-weight:500;letter-spacing:-0.035em;margin:0 0 32px;max-width:900px;text-wrap:pretty;">' + esc(S.headline) + '</h1>'
      + '<p data-reveal="1" data-reveal-index="2" style="font-size:19px;line-height:1.6;color:#9aa0a6;margin:0 0 48px;max-width:560px;text-wrap:pretty;">' + esc(S.introSub) + '</p>'
      + '<div data-reveal="1" data-reveal-index="3" style="display:flex;gap:10px;flex-wrap:wrap;font-family:' + MONO + ';font-size:12px;">'
      + '<a href="#contact" style="padding:12px 20px;background:#c8ff4d;color:#0b0c0e;border-radius:3px;font-weight:500;">Get in touch</a>'
      + '<a href="#work" style="padding:12px 20px;border:1px solid #2a2e33;border-radius:3px;color:#9aa0a6;">See the work</a>'
      + '</div></div>'
      + '<div data-reveal="1" data-reveal-index="2" style="flex:0 1 300px;min-width:220px;position:relative;aspect-ratio:4/5;border:1px solid #1e2024;border-radius:5px;overflow:hidden;background:#101215;">' + portrait + '</div>'
      + '</section>'
      + receiptsBlock();
  };

  function receiptsBlock() {
    if (!has(S.receipts)) return "";
    var items = S.receipts.map(function (r, i) {
      return '<div data-reveal="1" data-reveal-index="' + i + '" style="display:flex;align-items:baseline;gap:10px;">'
        + '<span style="font-size:22px;font-weight:500;letter-spacing:-0.02em;">' + esc(r.v) + '</span>'
        + '<span style="font-family:' + MONO + ';font-size:11px;color:#6e7379;letter-spacing:0.04em;">' + esc(r.k) + '</span></div>';
    }).join("");
    return '<section class="sec" style="padding:30px 72px;display:flex;flex-wrap:wrap;gap:18px 56px;">' + items + '</section>';
  }

  B.about = function () {
    var paras = S.about.map(function (p, i) {
      var color = i === 0 ? "#d4d6d8" : "#8b9096";
      var size = i === 0 ? "18px" : "16px";
      return '<p data-reveal="1" data-reveal-index="' + (i + 1) + '" style="font-size:' + size + ';line-height:1.66;color:' + color + ';margin:0 0 18px;text-wrap:pretty;">' + esc(p) + '</p>';
    }).join("");
    var facts = has(S.facts) ? '<div data-reveal="1" data-reveal-index="2" class="factbox" style="border:1px solid #1e2024;border-radius:4px;overflow:hidden;align-self:start;">'
      + S.facts.map(function (row) {
        return '<div style="display:flex;justify-content:space-between;gap:20px;padding:13px 16px;border-bottom:1px solid #1e2024;font-family:' + MONO + ';font-size:12px;">'
          + '<span style="color:#6e7379;">' + esc(row.k) + '</span><span style="color:#e9e9e4;text-align:right;">' + esc(row.v) + '</span></div>';
      }).join("") + '</div>' : "";
    return '<section id="about" class="sec grid" style="padding:80px 72px;display:grid;grid-template-columns:1.2fr 1fr;gap:72px;">'
      + '<div>' + kicker("about", "About") + paras + '</div>' + facts + '</section>';
  };

  B.principles = function () {
    var cards = S.principles.map(function (p, i) {
      return '<div data-reveal="1" data-reveal-index="' + i + '" style="display:flex;gap:18px;padding:24px;background:#101215;border:1px solid #1e2024;border-radius:5px;">'
        + '<span style="font-family:' + MONO + ';font-size:11px;color:#4d5257;padding-top:4px;">' + esc(p.no) + '</span>'
        + '<span><span style="display:block;font-size:17px;font-weight:500;letter-spacing:-0.01em;margin-bottom:8px;">' + esc(p.title) + '</span>'
        + '<span style="display:block;font-size:14px;line-height:1.62;color:#8b9096;">' + esc(p.body) + '</span></span></div>';
    }).join("");
    return '<section id="principles" class="sec" style="padding:80px 72px;">' + kicker("principles", "How I work")
      + '<div class="grid" style="display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:20px;">' + cards + '</div></section>';
  };

  B.stack = function () {
    var groups = S.skillGroups.map(function (g, i) {
      var items = (g.items || []).map(function (s) {
        return '<span style="display:inline-flex;align-items:center;white-space:nowrap;font-family:' + MONO + ';font-size:12px;color:#d4d6d8;padding:6px 11px;border:1px solid #24282d;border-radius:3px;background:#101215;">' + esc(s) + '</span>';
      }).join("");
      return '<div data-reveal="1" data-reveal-index="' + i + '"><div style="font-family:' + MONO + ';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#6e7379;padding-bottom:12px;border-bottom:1px solid #1e2024;margin-bottom:14px;">' + esc(g.label) + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:8px;">' + items + '</div></div>';
    }).join("");
    var certs = has(S.certs) ? '<div style="display:flex;flex-direction:column;gap:10px;">'
      + '<div style="font-family:' + MONO + ';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#6e7379;padding-bottom:12px;border-bottom:1px solid #1e2024;margin-bottom:4px;">Certifications</div>'
      + S.certs.map(function (c, i) {
        return '<div data-reveal="1" data-reveal-index="' + i + '" style="display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:#101215;border:1px solid #1e2024;border-radius:5px;">'
          + '<span style="font-family:' + MONO + ';font-size:10px;letter-spacing:0.08em;color:#9aa0a6;border:1px solid #2a2e33;padding:3px 6px;border-radius:2px;margin-top:2px;">' + esc(c.short) + '</span>'
          + '<span style="flex:1;"><span style="display:block;font-size:15px;font-weight:500;margin-bottom:3px;">' + esc(c.title) + '</span>'
          + '<span style="display:block;font-family:' + MONO + ';font-size:11px;color:#6e7379;">' + esc(c.year) + '</span></span></div>';
      }).join("") + '</div>' : "";
    var cols = certs ? "1.15fr 1fr" : "1fr";
    return '<section id="stack" class="sec" style="padding:80px 72px;">' + kicker("stack", "Stack & certifications")
      + '<div class="grid" style="display:grid;grid-template-columns:' + cols + ';gap:64px;padding-top:10px;">'
      + '<div style="display:flex;flex-direction:column;gap:26px;">' + groups + '</div>' + certs + '</div></section>';
  };

  B.work = function () {
    var cards = S.projects.map(function (p, i) {
      var tags = (p.tags || []).map(function (t) {
        return '<span style="font-family:' + MONO + ';font-size:10px;letter-spacing:0.05em;padding:4px 8px;border:1px solid #2a2e33;border-radius:99px;color:#9aa0a6;">' + esc(t) + '</span>';
      }).join("");
      var href = p.href ? esc(p.href) : "#study";
      var ext = p.href ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + href + '"' + ext + ' data-card="1" data-reveal="1" data-reveal-index="' + i + '" style="display:flex;flex-direction:column;gap:14px;padding:26px;background:#101215;border:1px solid #1e2024;border-radius:5px;transition:border-color 140ms,background 140ms;">'
        + '<div style="display:flex;justify-content:space-between;align-items:baseline;font-family:' + MONO + ';font-size:11px;color:#6e7379;"><span>' + esc(p.no) + '</span><span>' + esc(p.year) + '</span></div>'
        + '<div style="font-size:22px;font-weight:500;letter-spacing:-0.015em;line-height:1.25;">' + esc(p.title) + '</div>'
        + '<div style="font-size:15px;line-height:1.6;color:#8b9096;flex:1;">' + esc(p.desc) + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + tags + '</div></a>';
    }).join("");
    return '<section id="work" class="sec" style="padding:80px 72px;">' + kicker("work", "Selected work")
      + '<div class="grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;">' + cards + '</div></section>';
  };

  B.study = function () {
    var c = S.caseStudy;
    var out = '<section id="study" class="sec" style="padding:80px 72px;">'
      + '<div data-reveal="1" data-reveal-index="0" style="font-family:' + MONO + ';font-size:11px;color:#7d8288;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:26px;">' + noOf.study + ' — ' + esc(c.kicker || "Case study") + '</div>'
      + '<h2 data-reveal="1" data-reveal-index="1" style="font-size:40px;font-weight:500;letter-spacing:-0.03em;line-height:1.1;margin:0 0 16px;max-width:720px;text-wrap:pretty;">' + esc(c.title) + '</h2>'
      + '<p data-reveal="1" data-reveal-index="2" style="font-family:' + MONO + ';font-size:12px;color:#6e7379;margin:0 0 40px;">' + esc(c.meta) + '</p>';

    if (has(c.results)) {
      out += '<div class="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:40px;">'
        + c.results.map(function (r, i) {
          return '<div data-reveal="1" data-reveal-index="' + i + '" style="padding:24px;background:#101215;border:1px solid #1e2024;border-radius:5px;">'
            + '<div style="font-size:40px;font-weight:500;letter-spacing:-0.035em;color:#e9e9e4;margin-bottom:8px;">' + esc(r.v) + '</div>'
            + '<div style="font-family:' + MONO + ';font-size:11px;color:#8b9096;">' + esc(r.k) + '</div></div>';
        }).join("") + '</div>';
    }

    if (has(c.flow)) {
      out += '<div data-reveal="1" data-reveal-index="1" style="border:1px solid #1e2024;border-radius:5px;padding:30px;margin-bottom:40px;background:#0e1013;">'
        + '<div style="font-family:' + MONO + ';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#6e7379;margin-bottom:22px;">Request path, after</div>'
        + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
        + c.flow.map(function (step) {
          return '<div style="flex:1 1 150px;padding:16px 14px;border:1px solid #24282d;border-radius:4px;display:flex;flex-direction:column;gap:8px;background:#14171a;">'
            + '<span style="font-family:' + MONO + ';font-size:10px;color:#7d8288;letter-spacing:0.08em;">' + esc(step.no) + '</span>'
            + '<span style="font-size:14px;font-weight:500;">' + esc(step.title) + '</span>'
            + '<span style="font-size:12px;line-height:1.5;color:#7d8288;">' + esc(step.note) + '</span></div>';
        }).join("") + '</div></div>';
    }

    /* Interactive widget */
    if (c.widget) {
      out += buildWidget(c.widget);
    }

    /* Code + notes */
    if (has(c.code)) {
      var codeLines = c.code.map(function (text, i) {
        return '<span style="display:block;white-space:pre;"><span style="color:#33383d;user-select:none;display:inline-block;width:26px;">' + (i + 1) + '</span><span style="color:#a8b0b8;">' + esc(text) + '</span></span>';
      }).join("");
      var notes = has(c.notes) ? c.notes.map(function (n) {
        return '<div style="padding:16px 18px;background:#101215;border:1px solid #1e2024;border-radius:5px;">'
          + '<div style="font-family:' + MONO + ';font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;color:#4d5257;margin-bottom:8px;">' + esc(n.line) + '</div>'
          + '<div style="font-size:13.5px;line-height:1.6;color:#9aa0a6;">' + esc(n.body) + '</div></div>';
      }).join("") : "";
      out += '<div style="font-family:' + MONO + ';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#6e7379;margin:8px 0 16px;" data-reveal="1" data-reveal-index="0">The rule behind it</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:20px;margin-bottom:40px;" data-reveal="1" data-reveal-index="1">'
        + '<div style="flex:1 1 460px;min-width:0;border:1px solid #1e2024;border-radius:5px;overflow:hidden;background:#0e1013;">'
        + '<div style="display:flex;justify-content:space-between;gap:16px;padding:12px 18px;border-bottom:1px solid #1e2024;font-family:' + MONO + ';font-size:11px;color:#6e7379;"><span>RoutingResolver.resolve()</span><span>Script Include · scoped</span></div>'
        + '<div style="padding:20px 18px;overflow-x:auto;"><pre style="margin:0;font-family:' + MONO + ';font-size:12.5px;line-height:1.72;">' + codeLines + '</pre></div></div>'
        + '<div style="flex:1 1 260px;min-width:240px;display:flex;flex-direction:column;gap:14px;">' + notes + '</div></div>';
    }

    if (has(c.study)) {
      out += '<div class="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:40px;">'
        + c.study.map(function (col, i) {
          return '<div><h3 data-reveal="1" data-reveal-index="' + i + '" style="font-family:' + MONO + ';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#e9e9e4;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid #1e2024;">' + esc(col.h) + '</h3>'
            + '<p style="font-size:15px;line-height:1.66;color:#8b9096;margin:0;text-wrap:pretty;">' + esc(col.body) + '</p></div>';
        }).join("") + '</div>';
    }

    return out + '</section>';
  };

  function buildWidget(w) {
    var questions = (w.questions || []).map(function (q) {
      var opts = (q.options || []).map(function (o) {
        return '<button type="button" data-opt="' + esc(q.key) + '" data-val="' + esc(o) + '" style="cursor:pointer;font-family:' + MONO + ';font-size:12px;padding:8px 12px;border-radius:3px;transition:background 120ms ease,border-color 120ms ease,color 120ms ease;border:1px solid #24282d;background:#101215;color:#9aa0a6;">' + esc(o) + '</button>';
      }).join("");
      return '<div style="margin-bottom:22px;"><div style="font-family:' + MONO + ';font-size:11px;color:#6e7379;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:10px;">' + esc(q.label) + '</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:7px;">' + opts + '</div></div>';
    }).join("");
    return '<div style="font-family:' + MONO + ';font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#6e7379;margin-bottom:16px;" data-reveal="1" data-reveal-index="0">Try it — pick answers, watch the rules resolve</div>'
      + '<div id="widget" class="grid-widget" style="display:flex;flex-wrap:wrap;gap:1px;background:#1e2024;border:1px solid #1e2024;border-radius:5px;overflow:hidden;margin-bottom:40px;" data-reveal="1" data-reveal-index="1">'
      + '<div style="flex:1 1 400px;min-width:0;background:#0e1013;padding:28px;">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px;"><span style="font-size:16px;font-weight:500;">' + esc(w.formTitle) + '</span><span style="font-family:' + MONO + ';font-size:11px;color:#4d5257;">' + esc(w.itemLabel) + '</span></div>'
      + questions
      + '<button type="button" id="widget-reset" style="cursor:pointer;font-family:' + MONO + ';font-size:11px;color:#6e7379;background:none;border:none;padding:0;text-decoration:underline;">Reset</button></div>'
      + '<div style="flex:1 1 320px;min-width:0;background:#131619;padding:28px;display:flex;flex-direction:column;">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px;"><span style="font-size:16px;font-weight:500;">' + esc(w.resolvedTitle) + '</span><span style="font-family:' + MONO + ';font-size:11px;color:#4d5257;">' + esc(w.ruleName) + '</span></div>'
      + '<div id="widget-resolved"></div>'
      + '<div id="widget-verdict" style="margin-top:22px;padding:14px 16px;border-radius:4px;font-family:' + MONO + ';font-size:11.5px;line-height:1.55;"></div>'
      + '</div></div>';
  }

  B.experience = function () {
    var rows = S.jobs.map(function (j, i) {
      return '<div data-reveal="1" data-reveal-index="' + i + '" class="grid" style="display:grid;grid-template-columns:160px 1fr;gap:32px;padding:26px 0;border-top:1px solid #1e2024;">'
        + '<div style="font-family:' + MONO + ';font-size:12px;color:#6e7379;">' + esc(j.years) + '</div>'
        + '<div><div style="font-size:19px;font-weight:500;letter-spacing:-0.01em;margin-bottom:5px;">' + esc(j.role) + '</div>'
        + '<div style="font-family:' + MONO + ';font-size:12px;color:#b9bcc0;margin-bottom:10px;">' + esc(j.org) + '</div>'
        + '<p style="font-size:15px;line-height:1.62;color:#8b9096;margin:0;max-width:640px;text-wrap:pretty;">' + esc(j.note) + '</p></div></div>';
    }).join("");
    return '<section id="experience" class="sec" style="padding:80px 72px;">' + kicker("experience", "Experience") + rows + '</section>';
  };

  B.writing = function () {
    var rows = S.posts.map(function (w, i) {
      var href = w.href ? esc(w.href) : "#";
      var ext = w.href ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + href + '"' + ext + ' data-post="1" data-reveal="1" data-reveal-index="' + i + '" style="display:flex;flex-direction:column;gap:9px;padding:22px 10px 22px 0;border-top:1px solid #1e2024;transition:background 140ms ease,padding 140ms ease;">'
        + '<span style="display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-family:' + MONO + ';font-size:11px;"><span style="color:#6e7379;">' + esc(w.date) + '</span><span style="color:#3a4046;">·</span><span style="color:#9aa0a6;">' + esc(w.venue) + '</span></span>'
        + '<span style="display:flex;gap:16px;align-items:baseline;justify-content:space-between;"><span style="font-size:18px;font-weight:500;letter-spacing:-0.01em;">' + esc(w.title) + '</span><span style="font-family:' + MONO + ';font-size:13px;color:#6e7379;">↗</span></span>'
        + '<span style="font-size:14px;line-height:1.55;color:#8b9096;max-width:520px;">' + esc(w.desc) + '</span></a>';
    }).join("");
    return '<section id="writing" class="sec" style="padding:80px 72px;">' + kicker("writing", "Writing & community") + rows + '</section>';
  };

  B.now = function () {
    var items = S.now.map(function (n, i) {
      return '<li data-reveal="1" data-reveal-index="' + i + '" style="display:flex;gap:14px;padding:14px 0;border-top:1px solid #1e2024;font-size:15px;line-height:1.55;color:#b9bcc0;">'
        + '<span style="font-family:' + MONO + ';font-size:11px;color:#4d5257;padding-top:3px;">→</span><span>' + esc(n) + '</span></li>';
    }).join("");
    return '<section id="now" class="sec grid" style="padding:80px 72px;display:grid;grid-template-columns:1.2fr 1fr;gap:72px;">'
      + '<div>' + kicker("now", "Now") + '<p data-reveal="1" data-reveal-index="1" style="font-size:18px;line-height:1.66;color:#d4d6d8;margin:0;max-width:420px;text-wrap:pretty;">' + esc(S.nowLead || "") + '</p></div>'
      + '<ul style="margin:0;padding:0;list-style:none;align-self:center;">' + items + '</ul></section>';
  };

  B.contact = function () {
    var c = S.contact || {};
    var bigHref = c.email ? "mailto:" + esc(c.email) : (has(c.links) ? esc(c.links[0].href) : "#");
    var links = has(c.links) ? c.links.map(function (l) {
      return '<a href="' + esc(l.href) + '" target="_blank" rel="noopener" style="color:inherit;">' + esc(l.label) + '</a>';
    }).join("") : "";
    return '<section id="contact" style="padding:96px 72px 104px;" class="sec-contact">'
      + '<div data-reveal="1" data-reveal-index="0" style="font-family:' + MONO + ';font-size:11px;color:#7d8288;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:30px;">' + noOf.contact + ' — Contact</div>'
      + '<a href="' + bigHref + '" data-reveal="1" data-reveal-index="1" class="contact-big" style="display:inline-block;font-size:52px;font-weight:500;letter-spacing:-0.035em;margin-bottom:36px;border-bottom:2px solid #2a2e33;">' + esc(c.headline || "Get in touch") + '</a>'
      + '<div style="display:flex;gap:22px;flex-wrap:wrap;font-family:' + MONO + ';font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:#6e7379;">' + links + '</div></section>';
  };

  /* ---- Sidebar ---- */
  function sidebar() {
    var nav = active.map(function (d) {
      return '<a href="#' + d.id + '" data-navlink="1" style="display:flex;gap:12px;padding:8px 10px;margin-left:-10px;color:#9aa0a6;border-radius:3px;transition:background 130ms ease,color 130ms ease;">'
        + '<span style="color:#4d5257;">' + d.no + '</span><span>' + esc(d.label) + '</span></a>';
    }).join("");
    var status = S.status ? '<span style="display:flex;align-items:center;gap:8px;"><span style="width:6px;height:6px;border-radius:50%;background:#c8ff4d;display:inline-block;"></span>' + esc(S.status) + '</span>' : "";
    var resume = S.resumeUrl ? '<a href="' + esc(S.resumeUrl) + '" target="_blank" rel="noopener" style="color:#6e7379;">Résumé (PDF)</a>' : "";
    var footer = (status || resume) ? '<div style="display:flex;flex-direction:column;gap:7px;font-family:' + MONO + ';font-size:11px;color:#6e7379;">' + status + resume + '</div>' : '<div></div>';
    return '<aside class="side">'
      + '<div><div style="font-size:17px;font-weight:500;letter-spacing:-0.01em;margin-bottom:4px;">' + esc(S.name) + '</div>'
      + '<div style="font-family:' + MONO + ';font-size:11px;color:#6e7379;letter-spacing:0.04em;margin-bottom:48px;">' + esc(S.role) + '</div>'
      + '<nav style="display:flex;flex-direction:column;gap:2px;font-family:' + MONO + ';font-size:12px;">' + nav + '</nav></div>'
      + footer + '</aside>';
  }

  /* ---- Assemble ---- */
  var mainHtml = active.map(function (d) { return B[d.id](); }).join("");
  var footerHtml = '<footer style="border-top:1px solid #1e2024;padding:22px 72px;display:flex;justify-content:space-between;font-family:' + MONO + ';font-size:11px;color:#4d5257;"><span>' + esc(S.name) + '</span><span>' + esc(S.footerYear || "") + '</span></footer>';
  document.getElementById("app").innerHTML = '<div class="layout">' + sidebar() + '<main>' + mainHtml + footerHtml + '</main></div>';

  /* ---- Hover effects (cards, posts, contact) ---- */
  document.querySelectorAll('[data-card]').forEach(function (a) {
    a.addEventListener("mouseenter", function () { a.style.borderColor = "#3a4046"; a.style.background = "#14171a"; });
    a.addEventListener("mouseleave", function () { a.style.borderColor = "#1e2024"; a.style.background = "#101215"; });
  });
  document.querySelectorAll('[data-post]').forEach(function (a) {
    a.addEventListener("mouseenter", function () { a.style.background = "#101215"; a.style.paddingLeft = "10px"; });
    a.addEventListener("mouseleave", function () { a.style.background = "transparent"; a.style.paddingLeft = "0"; });
  });
  var cbig = document.querySelector(".contact-big");
  if (cbig) { cbig.addEventListener("mouseenter", function () { cbig.style.borderColor = "#c8ff4d"; }); cbig.addEventListener("mouseleave", function () { cbig.style.borderColor = "#2a2e33"; }); }

  /* ---- Interactive widget logic ---- */
  (function () {
    var w = (S.caseStudy && S.caseStudy.widget) || null;
    if (!w || !document.getElementById("widget")) return;
    var state = {};
    (w.questions || []).forEach(function (q) { state[q.key] = null; });
    var lit = "#e9e9e4", dim = "#4d5257";

    function paintOptions() {
      document.querySelectorAll("[data-opt]").forEach(function (b) {
        var on = state[b.dataset.opt] === b.dataset.val;
        b.style.background = on ? "#c8ff4d" : "#101215";
        b.style.borderColor = on ? "#c8ff4d" : "#24282d";
        b.style.color = on ? "#0b0c0e" : "#9aa0a6";
      });
    }
    function render() {
      var route = state.service ? w.routes[state.service] : null;
      var approval = state.region ? (w.regionApproval[state.region] || w.regionApproval._default) : null;
      var rows = [
        { k: "assignment_group", v: route ? route.group : "—", on: !!route },
        { k: "priority", v: state.urgency ? w.priority[state.urgency] : "—", on: !!state.urgency },
        { k: "sla_target", v: route ? route.sla : "—", on: !!route },
        { k: "approval", v: approval || "—", on: !!approval },
        { k: "tasks", v: route ? route.tasks : "—", on: !!route }
      ];
      var done = state.service && state.urgency && state.region;
      document.getElementById("widget-resolved").innerHTML = rows.map(function (r) {
        return '<div style="display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #1e2024;font-family:' + MONO + ';font-size:12px;">'
          + '<span style="color:#6e7379;">' + esc(r.k) + '</span><span style="text-align:right;color:' + (r.on ? lit : dim) + ';">' + esc(r.v) + '</span></div>';
      }).join("");
      var v = document.getElementById("widget-verdict");
      v.textContent = done ? w.verdictDone : w.verdictIdle;
      v.style.background = done ? "rgba(200,255,77,0.09)" : "#101215";
      v.style.color = done ? "#c8ff4d" : "#6e7379";
      paintOptions();
    }
    document.querySelectorAll("[data-opt]").forEach(function (b) {
      b.addEventListener("click", function () {
        var k = b.dataset.opt, val = b.dataset.val;
        state[k] = state[k] === val ? null : val;
        render();
      });
    });
    var reset = document.getElementById("widget-reset");
    if (reset) reset.addEventListener("click", function () { for (var k in state) state[k] = null; render(); });
    render();
  })();

  /* ---- Reveal on scroll (Blur in) ---- */
  (function () {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var nodes = Array.prototype.slice.call(document.querySelectorAll("[data-reveal]"));
    if (reduce || !("IntersectionObserver" in window)) return;
    var from = { opacity: "0", filter: "blur(14px)", transform: "translateY(14px) scale(.985)" };
    nodes.forEach(function (n) {
      n.style.willChange = "opacity, transform, filter";
      n.style.opacity = from.opacity; n.style.filter = from.filter; n.style.transform = from.transform;
    });
    var dur = 820, ease = "cubic-bezier(.22,1,.36,1)", stagger = 60;
    function show(n) {
      if (n.dataset.revealed) return;
      n.dataset.revealed = "1";
      var i = Number(n.dataset.revealIndex || 0);
      n.style.transition = "opacity " + dur + "ms " + ease + " " + (i * stagger) + "ms, transform " + dur + "ms " + ease + " " + (i * stagger) + "ms, filter " + dur + "ms " + ease + " " + (i * stagger) + "ms";
      requestAnimationFrame(function () { n.style.opacity = "1"; n.style.filter = "blur(0px)"; n.style.transform = "translateY(0) scale(1)"; });
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });
    }, { rootMargin: "0px 0px -12% 0px", threshold: 0.12 });
    nodes.forEach(function (n) { io.observe(n); });

    // Safety net: nothing stays invisible if the user scrolls fast or jumps via a hash link.
    function sweep() {
      var vh = window.innerHeight;
      nodes.forEach(function (n) {
        if (n.dataset.revealed) return;
        if (n.getBoundingClientRect().top < vh * 0.98) { show(n); io.unobserve(n); }
      });
    }
    window.addEventListener("scroll", sweep, { passive: true });
    window.addEventListener("resize", sweep);
    window.addEventListener("hashchange", function () { setTimeout(sweep, 60); });
  })();

  /* ---- Scroll-spy nav highlight ---- */
  (function () {
    var links = Array.prototype.slice.call(document.querySelectorAll("[data-navlink]"));
    var secs = links.map(function (l) { return document.querySelector(l.getAttribute("href")); });
    var activeIndex = 0;
    function paint() {
      links.forEach(function (l, i) {
        var on = i === activeIndex;
        l.style.background = on ? "#c8ff4d" : "transparent";
        l.style.color = on ? "#0b0c0e" : "#9aa0a6";
        var num = l.firstElementChild;
        if (num) num.style.color = on ? "rgba(11,12,14,.6)" : "#4d5257";
      });
    }
    links.forEach(function (l, i) {
      l.addEventListener("mouseenter", function () { if (i !== activeIndex) { l.style.background = "#14171a"; l.style.color = "#e9e9e4"; } });
      l.addEventListener("mouseleave", paint);
      l.addEventListener("click", function () { activeIndex = i; paint(); });
    });
    function compute() {
      var vh = window.innerHeight, line = Math.max(vh * 0.34, 80), idx = 0;
      secs.forEach(function (s, i) { if (s && s.getBoundingClientRect().top <= line) idx = i; });
      var last = secs[secs.length - 1];
      if (last && last.getBoundingClientRect().bottom <= vh + 6) idx = secs.length - 1;
      if (idx !== activeIndex) { activeIndex = idx; paint(); }
    }
    window.addEventListener("scroll", compute, { passive: true });
    window.addEventListener("resize", compute);
    compute(); paint();
  })();

})();
</script>
</body>
</html>
